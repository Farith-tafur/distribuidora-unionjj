<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FF0A0A" />
    <meta name="robots" content="noindex" />

    <title>¡Gracias! - Distribuidora UniónJJ Iquitos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Oswald:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/estilo.css" />

    <style>
      .gracias-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        background: linear-gradient(135deg, #fff5f5 0%, #f0f4ff 100%);
      }
      .gracias-card {
        background: white;
        padding: 60px 40px;
        border-radius: 25px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        text-align: center;
        max-width: 550px;
        width: 100%;
        border-top: 5px solid #ff0a0a;
      }
      .gracias-icono {
        width: 100px;
        height: 100px;
        background: linear-gradient(135deg, #ff2d2d, #e00000);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 3rem;
        margin: 0 auto 30px;
        box-shadow: 0 15px 40px rgba(255, 10, 10, 0.4);
        animation: scaleIn 0.5s ease;
      }
      @keyframes scaleIn {
        from {
          transform: scale(0);
        }
        to {
          transform: scale(1);
        }
      }
      .gracias-card h1 {
        font-family: "Oswald", sans-serif;
        font-size: 2.5rem;
        color: #003049;
        margin-bottom: 15px;
        font-weight: 700;
      }
      .gracias-card p {
        color: #555;
        font-size: 1.1rem;
        line-height: 1.7;
        margin-bottom: 30px;
      }
      .gracias-botones {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <div class="gracias-container">
      <div class="gracias-card">
        <div class="gracias-icono">
          <i class="fas fa-check"></i>
        </div>
        <h1>¡Mensaje Enviado!</h1>
        <p>
          Gracias por contactarnos. Hemos recibido tu mensaje y te responderemos
          lo antes posible al correo o WhatsApp que nos indicaste.
        </p>
        <div class="gracias-botones">
          <a href="index.html" class="btn-primario">
            <i class="fas fa-home"></i> Volver al Inicio
          </a>
          <a
            href="https://wa.me/51935971893"
            target="_blank"
            rel="noopener"
            class="btn-secundario"
          >
            <i class="fab fa-whatsapp"></i> WhatsApp
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
